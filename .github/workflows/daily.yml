name: 每日天气播报

on:
  schedule:
    # UTC 22:45 = 北京时间 06:45（每天一次；分钟避免整点，减小 GitHub 高峰延迟）
    - cron: "45 22 * * *"
  workflow_dispatch: {} # 手动触发

permissions:
  contents: write # 归档数据需要提交回仓库

concurrency:
  group: weather-daily
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 抓取天气并推送
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          QW_API_KEY: ${{ secrets.QW_API_KEY }}
        run: node src/index.js

      - name: 提交历史归档
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/ 与 weather-badge.svg 每次运行都会生成；reports/ 仅在每月 1 号生成
          git add data weather-badge.svg 2>/dev/null || true
          if [ -d reports ]; then git add reports; fi
          if git diff --cached --quiet; then
            echo "没有归档变更，跳过提交"
          else
            git commit -m "chore: archive weather data [skip ci]"
            git push
          fi